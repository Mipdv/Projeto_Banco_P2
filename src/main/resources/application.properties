spring.application.name=demo_2

# Lê as variáveis do arquivo .env na raiz do projeto (se existir).
# Variáveis de ambiente do sistema têm prioridade sobre o .env.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/BANCO_MISTER
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Origens do front liberadas no CORS (separadas por vírgula)
app.cors.allowed-origins=http://localhost:5173
spring.cloud.openfeign.client.config.moeda.connect-timeout=3000
spring.cloud.openfeign.client.config.moeda.read-timeout=5000